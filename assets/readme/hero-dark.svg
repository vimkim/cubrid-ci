<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">cubrid-ci architecture and verification contract (dark theme)</title>
  <desc id="desc">Exact-commit GitHub Actions evidence collection across test_medium, test_sql, test_shell, and opt-in test_sql_by_cci, v3 rerun validation, offline verify, and separation of CI outcome data from collection trustworthiness exit codes.</desc>
  <defs>
    <pattern id="dot-grid-dark" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1" fill="#30363d" opacity="0.4"/>
    </pattern>
    <linearGradient id="header-glow-dark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1f6feb" stop-opacity="0.22"/>
      <stop offset="50%" stop-color="#8957e5" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#238636" stop-opacity="0.16"/>
    </linearGradient>
  </defs>

  <!-- Outer Frame -->
  <rect x="1" y="1" width="1198" height="518" rx="16" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>
  <rect x="2" y="2" width="1196" height="516" rx="15" fill="url(#dot-grid-dark)"/>
  <path d="M 17 2 H 1183 A 15 15 0 0 1 1198 17 V 104 H 2 V 17 A 15 15 0 0 1 17 2 Z" fill="url(#header-glow-dark)"/>

  <!-- Header Left: Emblem + Title + Subtitle -->
  <g transform="translate(40, 32)">
    <rect x="0" y="0" width="44" height="44" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.2"/>
    <circle cx="14" cy="14" r="3.5" fill="none" stroke="#58a6ff" stroke-width="2"/>
    <circle cx="14" cy="30" r="3.5" fill="none" stroke="#bc8cff" stroke-width="2"/>
    <line x1="14" y1="17.5" x2="14" y2="26.5" stroke="#8b949e" stroke-width="1.8"/>
    <path d="M23 22 L28 27 L36 16" fill="none" stroke="#3fb950" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <text x="98" y="54" fill="#e6edf3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="700" letter-spacing="-0.4">cubrid-ci</text>

  <rect x="216" y="34" width="194" height="24" rx="12" fill="#388bfd" fill-opacity="0.15" stroke="#1f6feb" stroke-width="1"/>
  <text x="313" y="50" text-anchor="middle" fill="#58a6ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" letter-spacing="0.6">EXACT-COMMIT CI EVIDENCE</text>

  <text x="98" y="79" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13">Durable GitHub Actions evidence collection &amp; offline verification for CUBRID</text>

  <!-- Header Right: 5 CLI Command Pills -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="11.5" font-weight="600">
    <rect x="690" y="40" width="64" height="30" rx="7" fill="#161b22" stroke="#30363d"/>
    <text x="722" y="59" text-anchor="middle" fill="#e6edf3">status</text>

    <rect x="762" y="40" width="74" height="30" rx="7" fill="#388bfd" fill-opacity="0.14" stroke="#1f6feb"/>
    <text x="799" y="59" text-anchor="middle" fill="#58a6ff">collect</text>

    <rect x="844" y="40" width="110" height="30" rx="7" fill="#388bfd" fill-opacity="0.14" stroke="#1f6feb"/>
    <text x="899" y="59" text-anchor="middle" fill="#58a6ff">collect-base</text>

    <rect x="962" y="40" width="124" height="30" rx="7" fill="#388bfd" fill-opacity="0.14" stroke="#1f6feb"/>
    <text x="1024" y="59" text-anchor="middle" fill="#58a6ff">collect-commit</text>

    <rect x="1094" y="40" width="66" height="30" rx="7" fill="#2ea043" fill-opacity="0.15" stroke="#238636"/>
    <text x="1127" y="59" text-anchor="middle" fill="#3fb950">verify</text>
  </g>

  <line x1="40" y1="104" x2="1160" y2="104" stroke="#21262d" stroke-width="1.2"/>

  <!-- Column 1: Exact-Commit Targets & Suite Matrix -->
  <rect x="40" y="122" width="320" height="252" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.2"/>
  <circle cx="58" cy="142" r="4" fill="#58a6ff"/>
  <text x="70" y="146" fill="#58a6ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" letter-spacing="0.5">1. EXACT-COMMIT TARGETS</text>

  <!-- Sub-card 1A: Targets -->
  <rect x="54" y="158" width="292" height="82" rx="8" fill="#0d1117" stroke="#21262d" stroke-width="1"/>
  <text x="66" y="176" fill="#e6edf3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600">GitHub Actions + Evidence Server</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="10">
    <rect x="66" y="186" width="120" height="22" rx="5" fill="#161b22" stroke="#30363d"/>
    <text x="126" y="200" text-anchor="middle" fill="#e6edf3">PR HEAD · collect</text>

    <rect x="192" y="186" width="142" height="22" rx="5" fill="#161b22" stroke="#30363d"/>
    <text x="263" y="200" text-anchor="middle" fill="#e6edf3">SHA · collect-commit</text>

    <rect x="66" y="212" width="134" height="22" rx="5" fill="#161b22" stroke="#30363d"/>
    <text x="133" y="226" text-anchor="middle" fill="#e6edf3">Base · collect-base</text>

    <rect x="206" y="212" width="128" height="22" rx="5" fill="#161b22" stroke="#30363d"/>
    <text x="270" y="226" text-anchor="middle" fill="#8b949e">Pin run / attempt</text>
  </g>

  <!-- Sub-card 1B: Suite Matrix -->
  <rect x="54" y="248" width="292" height="114" rx="8" fill="#0d1117" stroke="#21262d" stroke-width="1"/>
  <text x="66" y="266" fill="#e6edf3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600">Suite Matrix</text>
  <text x="334" y="266" text-anchor="end" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10">default 3</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="10.5" font-weight="600">
    <rect x="66" y="276" width="94" height="24" rx="6" fill="#388bfd" fill-opacity="0.14" stroke="#1f6feb"/>
    <text x="113" y="292" text-anchor="middle" fill="#58a6ff">test_medium</text>

    <rect x="166" y="276" width="76" height="24" rx="6" fill="#388bfd" fill-opacity="0.14" stroke="#1f6feb"/>
    <text x="204" y="292" text-anchor="middle" fill="#58a6ff">test_sql</text>

    <rect x="248" y="276" width="86" height="24" rx="6" fill="#388bfd" fill-opacity="0.14" stroke="#1f6feb"/>
    <text x="291" y="292" text-anchor="middle" fill="#58a6ff">test_shell</text>
  </g>

  <!-- Opt-in box -->
  <rect x="66" y="308" width="268" height="44" rx="6" fill="#bb8009" fill-opacity="0.08" stroke="#9e6a03" stroke-dasharray="4 3"/>
  <rect x="74" y="318" width="120" height="24" rx="5" fill="#bb8009" fill-opacity="0.18" stroke="#9e6a03"/>
  <text x="134" y="334" text-anchor="middle" fill="#e3b341" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="10.5" font-weight="600">test_sql_by_cci</text>
  <text x="202" y="328" fill="#e3b341" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" font-weight="600">opt-in (--suite)</text>
  <text x="202" y="342" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10">counts from JUnit XML</text>

  <!-- Connector 1 -> 2 -->
  <line x1="364" y1="248" x2="394" y2="248" stroke="#58a6ff" stroke-width="2"/>
  <polygon points="402,248 392,242 392,254" fill="#58a6ff"/>

  <!-- Column 2: Provenance & Rerun Validation -->
  <rect x="404" y="122" width="364" height="252" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.2"/>
  <circle cx="422" cy="142" r="4" fill="#bc8cff"/>
  <text x="434" y="146" fill="#bc8cff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" letter-spacing="0.5">2. PROVENANCE &amp; RERUN VALIDATION</text>

  <!-- Sub-card 2A: Shard & Digest Integrity -->
  <rect x="418" y="158" width="336" height="84" rx="8" fill="#0d1117" stroke="#21262d" stroke-width="1"/>
  <text x="430" y="176" fill="#e6edf3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600">Shard &amp; Digest Integrity</text>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#8b949e">
    <path d="M430 194 L433.5 197.5 L440 190.5" fill="none" stroke="#3fb950" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="447" y="197">Engine commit identity + SHA-256 raw index</text>

    <path d="M430 211 L433.5 214.5 L440 207.5" fill="none" stroke="#3fb950" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="447" y="214">test_rc / ctp_rc + JUnit &lt;-&gt; failure agreement</text>

    <path d="M430 228 L433.5 231.5 L440 224.5" fill="none" stroke="#3fb950" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="447" y="231">Suite-isolated failures · append-only observations</text>
  </g>

  <!-- Sub-card 2B: /run rerun Source Validation -->
  <rect x="418" y="250" width="336" height="112" rx="8" fill="#8957e5" fill-opacity="0.08" stroke="#8957e5" stroke-opacity="0.55" stroke-width="1"/>
  <text x="430" y="269" fill="#e6edf3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600">/run rerun Source Validation</text>

  <rect x="706" y="255" width="36" height="18" rx="9" fill="#8957e5" fill-opacity="0.22" stroke="#8957e5"/>
  <text x="724" y="268" text-anchor="middle" fill="#bc8cff" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="10" font-weight="700">v3</text>

  <rect x="430" y="280" width="142" height="44" rx="6" fill="#0d1117" stroke="#30363d"/>
  <text x="501" y="298" text-anchor="middle" fill="#e6edf3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="600">Source Summary</text>
  <text x="501" y="313" text-anchor="middle" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="9.5">independently verified</text>

  <line x1="574" y1="302" x2="592" y2="302" stroke="#bc8cff" stroke-width="1.6"/>
  <polygon points="598,302 590,297.5 590,306.5" fill="#bc8cff"/>

  <rect x="600" y="280" width="142" height="44" rx="6" fill="#0d1117" stroke="#8957e5" stroke-opacity="0.7"/>
  <text x="671" y="298" text-anchor="middle" fill="#bc8cff" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="10" font-weight="600">suite-summary-v3</text>
  <text x="671" y="313" text-anchor="middle" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="9.5">selected cases only</text>

  <text x="430" y="346" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10">Empty selection carries source verdict · ambiguous attempt fails</text>

  <!-- Connector 2 -> 3 -->
  <line x1="772" y1="248" x2="802" y2="248" stroke="#bc8cff" stroke-width="2"/>
  <polygon points="810,248 800,242 800,254" fill="#bc8cff"/>

  <!-- Column 3: Durable Store & Offline Verify -->
  <rect x="812" y="122" width="348" height="252" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.2"/>
  <circle cx="830" cy="142" r="4" fill="#3fb950"/>
  <text x="842" y="146" fill="#3fb950" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" letter-spacing="0.5">3. DURABLE STORE &amp; VERIFY</text>

  <!-- Sub-card 3A: Immutable Evidence Root -->
  <rect x="826" y="158" width="320" height="96" rx="8" fill="#0d1117" stroke="#21262d" stroke-width="1"/>
  <text x="838" y="176" fill="#e6edf3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600">Immutable Local Evidence Root</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="10" fill="#8b949e">
    <text x="838" y="196">observations/&lt;id&gt;/{request,result}.json</text>
    <text x="838" y="212">manifest.json <tspan fill="#58a6ff">(v2 PR / v3 commit)</tspan></text>
    <text x="838" y="228">summaries/ · raw/ · failures/ · binaries/</text>
    <text x="838" y="244">baseline-resolutions/ · git-cache/</text>
  </g>

  <!-- Sub-card 3B: Offline Verify -->
  <rect x="826" y="264" width="320" height="98" rx="8" fill="#2ea043" fill-opacity="0.09" stroke="#238636" stroke-width="1"/>
  <text x="838" y="283" fill="#e6edf3" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="11.5" font-weight="700">cubrid-ci verify</text>

  <rect x="1078" y="270" width="56" height="18" rx="9" fill="#2ea043" fill-opacity="0.22" stroke="#238636"/>
  <text x="1106" y="283" text-anchor="middle" fill="#3fb950" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700">OFFLINE</text>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#8b949e">
    <path d="M838 303 L841.5 306.5 L848 299.5" fill="none" stroke="#3fb950" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="855" y="306">Zero network / zero writes (read-only)</text>

    <path d="M838 322 L841.5 325.5 L848 318.5" fill="none" stroke="#3fb950" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="855" y="325">Checks digests, JUnit byte-for-byte, pins</text>

    <path d="M838 341 L841.5 344.5 L848 337.5" fill="none" stroke="#3fb950" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="855" y="344">Emits verification-v1 assessment report</text>
  </g>

  <!-- Bottom Left Card: CI Outcome is Data -->
  <rect x="40" y="390" width="548" height="106" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.2"/>
  <text x="56" y="412" fill="#e6edf3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" letter-spacing="0.4">CI OUTCOME IS DATA</text>
  <rect x="462" y="397" width="110" height="20" rx="10" fill="#388bfd" fill-opacity="0.14" stroke="#1f6feb"/>
  <text x="517" y="411" text-anchor="middle" fill="#58a6ff" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="10" font-weight="600">stdout / --json</text>

  <rect x="56" y="423" width="516" height="28" rx="6" fill="#0d1117" stroke="#21262d"/>
  <text x="68" y="441" fill="#f85149" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="11" font-weight="600">test_shell: FAILURE (3 failed / 3256 executed)</text>
  <text x="560" y="441" text-anchor="end" fill="#3fb950" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="11" font-weight="700">-&gt; exit 0</text>

  <text x="56" y="469" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11">A fully collected red suite exits 0. Interactive progress renders on</text>
  <text x="56" y="484" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11">TTY stderr only, keeping stdout a single machine-readable JSON value.</text>

  <!-- Bottom Right Card: Collection Trustworthiness (Exit Codes) -->
  <rect x="604" y="390" width="556" height="106" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.2"/>
  <text x="620" y="412" fill="#e6edf3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" letter-spacing="0.4">COLLECTION TRUSTWORTHINESS</text>
  <rect x="1044" y="397" width="100" height="20" rx="10" fill="#21262d" stroke="#30363d"/>
  <text x="1094" y="411" text-anchor="middle" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="10" font-weight="600">process exit</text>

  <!-- Row 1 of Exit Codes -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11">
    <!-- 0 -->
    <rect x="620" y="425" width="168" height="26" rx="6" fill="#0d1117" stroke="#238636"/>
    <rect x="624" y="429" width="22" height="18" rx="4" fill="#2ea043" fill-opacity="0.22"/>
    <text x="635" y="442" text-anchor="middle" fill="#3fb950" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="11" font-weight="700">0</text>
    <text x="654" y="442" fill="#e6edf3" font-weight="600">Verified</text>

    <!-- 2 -->
    <rect x="796" y="425" width="168" height="26" rx="6" fill="#0d1117" stroke="#9e6a03"/>
    <rect x="800" y="429" width="22" height="18" rx="4" fill="#bb8009" fill-opacity="0.22"/>
    <text x="811" y="442" text-anchor="middle" fill="#e3b341" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="11" font-weight="700">2</text>
    <text x="830" y="442" fill="#e6edf3">Bad input / cfg</text>

    <!-- 3 -->
    <rect x="972" y="425" width="172" height="26" rx="6" fill="#0d1117" stroke="#9e6a03"/>
    <rect x="976" y="429" width="22" height="18" rx="4" fill="#bb8009" fill-opacity="0.22"/>
    <text x="987" y="442" text-anchor="middle" fill="#e3b341" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="11" font-weight="700">3</text>
    <text x="1006" y="442" fill="#e6edf3">Unfinished / N/A</text>

    <!-- 4 -->
    <rect x="620" y="458" width="168" height="26" rx="6" fill="#0d1117" stroke="#da3633"/>
    <rect x="624" y="462" width="22" height="18" rx="4" fill="#f85149" fill-opacity="0.20"/>
    <text x="635" y="475" text-anchor="middle" fill="#f85149" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="11" font-weight="700">4</text>
    <text x="654" y="475" fill="#e6edf3">Integrity fail</text>

    <!-- 5 -->
    <rect x="796" y="458" width="168" height="26" rx="6" fill="#0d1117" stroke="#da3633"/>
    <rect x="800" y="462" width="22" height="18" rx="4" fill="#f85149" fill-opacity="0.20"/>
    <text x="811" y="475" text-anchor="middle" fill="#f85149" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="11" font-weight="700">5</text>
    <text x="830" y="475" fill="#e6edf3">Remote / budget</text>

    <!-- 6 -->
    <rect x="972" y="458" width="172" height="26" rx="6" fill="#0d1117" stroke="#da3633"/>
    <rect x="976" y="462" width="22" height="18" rx="4" fill="#f85149" fill-opacity="0.20"/>
    <text x="987" y="475" text-anchor="middle" fill="#f85149" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="11" font-weight="700">6</text>
    <text x="1006" y="475" fill="#e6edf3">Local I/O fail</text>
  </g>
</svg>
