[package]
name = "cubrid-ci"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
description = "Inspect CUBRID pull-request status and collect exact-commit GitHub Actions evidence"
license = "Apache-2.0"
publish = false

[[bin]]
name = "cubrid-ci"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.6", features = ["derive", "env"] }
futures-util = "0.3"
hex = "0.4"
humantime = "2.3"
regex = "1.12"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream"] }
roxmltree = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
toml = "0.8"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2"
walkdir = "2"

[dev-dependencies]
jsonschema = { version = "0.48", default-features = false }
wiremock = "0.6"

[profile.release]
strip = true
lto = "thin"
